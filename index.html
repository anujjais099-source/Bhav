<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Rate — Gold &amp; Silver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --lac:#6E1216;        /* bahi-khata lacquer red */
    --lac-deep:#490B0E;
    --lac-line:#8A2A2C;
    --ivory:#F3E9D2;      /* ledger paper */
    --ivory-dim:#C9B694;
    --gold:#D6A94A;
    --silver:#BFC7D0;
    --up:#7FBF6A;
    --down:#E8836F;
    --num: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --dev: "Tiro Devanagari Hindi", Georgia, serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #7d181c 0%, var(--lac) 42%, var(--lac-deep) 100%);
    color:var(--ivory);
    font-family:var(--num);
    min-height:100vh;
    padding:clamp(16px,4vw,40px) clamp(14px,4vw,32px) 40px;
    -webkit-font-smoothing:antialiased;
  }

  /* gold-leaf hairline used as the page's structural device */
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}

  header{max-width:760px;margin:0 auto 22px;text-align:center}
  .shop{
    font-family:var(--dev);
    font-size:clamp(19px,4.5vw,26px);
    letter-spacing:.01em;
    color:var(--ivory);
  }
  .date{
    margin-top:6px;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ivory-dim);
  }

  main{max-width:760px;margin:0 auto;display:grid;gap:clamp(14px,2.6vw,20px)}

  .card{
    border:1px solid var(--lac-line);
    border-radius:3px;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.10));
    padding:clamp(18px,4vw,28px) clamp(16px,4vw,30px);
    position:relative;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(214,169,74,.16);
  }

  .metal{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-bottom:14px;
  }
  .metal h2{
    font-family:var(--dev);
    font-weight:400;
    font-size:clamp(20px,4.6vw,26px);
    line-height:1.1;
  }
  .metal h2 span{
    display:block;
    font-family:var(--num);
    font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ivory-dim);margin-top:4px;
  }
  .swatch{width:10px;height:10px;border-radius:50%;flex:0 0 auto;align-self:center}
  .swatch.g{background:var(--gold);box-shadow:0 0 12px rgba(214,169,74,.55)}
  .swatch.s{background:var(--silver);box-shadow:0 0 12px rgba(191,199,208,.45)}

  .big{
    font-size:clamp(46px,15vw,104px);
    font-weight:800;
    line-height:.92;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:.12em;
  }
  .big .rs{font-size:.42em;font-weight:500;color:var(--ivory-dim);letter-spacing:0}
  .gold-num{color:var(--gold)}
  .silver-num{color:var(--silver)}

  .unit{
    margin-top:8px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ivory-dim);
  }
  .delta{
    margin-top:12px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--ivory-dim)}

  .sub{
    margin-top:18px;padding-top:14px;border-top:1px dashed rgba(214,169,74,.25);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:clamp(14px,3.4vw,17px);
  }
  .sub .lbl{font-family:var(--dev);color:var(--ivory-dim);font-size:.95em}
  .sub .val{font-weight:700;font-variant-numeric:tabular-nums}

  /* international strip — deliberately quiet, sits under the Indian rate */
  .intl{
    max-width:760px;margin:4px auto 0;
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ivory-dim);
    padding:14px 0;
  }
  .intl b{color:var(--ivory);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}

  footer{max-width:760px;margin:26px auto 0;text-align:center}
  .live{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ivory-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .note{margin-top:14px;font-size:12px;line-height:1.6;color:var(--ivory-dim);max-width:52ch;margin-inline:auto}

  .settings-btn{
    margin-top:18px;background:none;border:1px solid var(--lac-line);color:var(--ivory-dim);
    font-family:var(--num);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    padding:9px 16px;border-radius:2px;cursor:pointer;
  }
  .settings-btn:hover{color:var(--ivory);border-color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .panel{
    max-width:760px;margin:16px auto 0;border:1px solid var(--lac-line);border-radius:3px;
    padding:18px;display:none;background:rgba(0,0,0,.16);
  }
  .panel.open{display:block}
  .panel h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-dim);margin-bottom:14px;font-weight:700}
  .row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0}
  .row label{font-size:14px}
  .row small{display:block;color:var(--ivory-dim);font-size:11px;margin-top:2px}
  .row input{
    width:110px;background:rgba(0,0,0,.3);border:1px solid var(--lac-line);color:var(--ivory);
    font-family:var(--num);font-weight:700;font-size:15px;padding:8px 10px;border-radius:2px;
    text-align:right;font-variant-numeric:tabular-nums;
  }

  @media (prefers-reduced-motion:reduce){
    .dot{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="shop">आज का भाव</div>
  <div class="date" id="today">—</div>
</header>
<div class="rule" style="max-width:760px;margin:0 auto 20px"></div>

<main>
  <!-- GOLD -->
  <section class="card">
    <div class="metal">
      <h2>सोना<span>Gold 999 · 24K</span></h2>
      <div class="swatch g"></div>
    </div>
    <div class="big gold-num"><span class="rs">₹</span><span id="gold999">—</span></div>
    <div class="unit">per 10 grams</div>
    <div class="delta flat" id="goldDelta">—</div>
    <div class="sub">
      <span class="lbl">Gold 916 · 22K</span>
      <span class="val gold-num">₹<span id="gold916">—</span></span>
    </div>
  </section>

  <!-- SILVER -->
  <section class="card">
    <div class="metal">
      <h2>चाँदी<span>Silver 999</span></h2>
      <div class="swatch s"></div>
    </div>
    <div class="big silver-num"><span class="rs">₹</span><span id="silver999">—</span></div>
    <div class="unit">per kilogram</div>
    <div class="delta flat" id="silverDelta">—</div>
    <div class="sub">
      <span class="lbl">per 10 grams</span>
      <span class="val silver-num">₹<span id="silver10g">—</span></span>
    </div>
  </section>
</main>

<div class="intl">
  <span>Gold <b id="spotGold">—</b> /oz</span>
  <span>Silver <b id="spotSilver">—</b> /oz</span>
  <span>USD-INR <b id="fx">—</b></span>
</div>

<footer>
  <div class="live"><span class="dot"></span><span id="stamp">connecting</span></div>
  <p class="note">Indicative rate, calculated from international spot price with import duty, GST and local premium. Not an exchange quote.</p>
</footer>

<script>
/* Live data from your own backend. The API key stays on the server;
   Vercel's CDN caches the response for 60s so one upstream call
   serves every visitor and every widget. */

const API = '/api/rate';

const inr = n => Math.round(n).toLocaleString('en-IN');

let prev = null;          // first reading of this page session
let lastGood = null;      // never blank the board

function setDelta(el, now, before){
  if (before === null){ el.textContent = 'first reading'; el.className = 'delta flat'; return; }
  const d = Math.round(now - before);
  el.className = 'delta ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat');
  el.textContent = d === 0 ? 'no change' : (d > 0 ? 'UP RS ' : 'DOWN RS ') + inr(Math.abs(d)) + ' since open';
}

function paint(d){
  document.getElementById('gold999').textContent = inr(d.gold.per10g999);
  document.getElementById('gold916').textContent = inr(d.gold.per10g916);

  if (d.silver){
    document.getElementById('silver999').textContent = inr(d.silver.perKg999);
    document.getElementById('silver10g').textContent = inr(d.silver.per10g999);
  } else {
    document.getElementById('silver999').textContent = '-';
    document.getElementById('silver10g').textContent = '-';
    document.getElementById('silverDelta').textContent = 'silver feed not connected yet';
  }

  const intl = d.international || {};
  document.getElementById('spotGold').textContent   = intl.goldUsdPerOz ? '$' + intl.goldUsdPerOz.toFixed(2) : '-';
  document.getElementById('spotSilver').textContent = intl.silverUsdPerOz ? '$' + intl.silverUsdPerOz.toFixed(2) : '-';
  document.getElementById('fx').textContent         = intl.usdInr ? intl.usdInr.toFixed(2) : '-';

  if (prev === null) prev = { g: d.gold.per10g999, s: d.silver ? d.silver.perKg999 : null };
  setDelta(document.getElementById('goldDelta'), d.gold.per10g999, prev.g);
  if (d.silver) setDelta(document.getElementById('silverDelta'), d.silver.perKg999, prev.s);

  document.getElementById('stamp').textContent =
    'updated ' + new Date(d.updatedAt).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}

async function tick(){
  try {
    const res = await fetch(API, { cache: 'no-store' });
    if (!res.ok) throw new Error('rate ' + res.status);
    const d = await res.json();
    if (!d.gold) throw new Error('no gold in response');
    lastGood = d;
    paint(d);
  } catch (err) {
    // An older number with an honest label beats a blank board.
    document.getElementById('stamp').textContent = lastGood
      ? 'reconnecting - showing last known rate'
      : 'rate unavailable - retrying';
    console.warn('rate fetch failed:', err.message);
  }
}

document.getElementById('today').textContent =
  new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

tick();
setInterval(tick, 60000);
</script>
</body>
</html>
