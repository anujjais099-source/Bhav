name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Every run is a fresh VM, so without this each build gets signed with
      # a brand-new random debug key — installing a newer APK over an older
      # one would fail with a signature mismatch. Caching the keystore keeps
      # every build signed the same way, so updates always install cleanly.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (build log convenience)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk bhav-tau.apk

      # Publishes/updates a single rolling "latest" release so the site can
      # link to one unchanging URL. Public release assets download with no
      # GitHub login required, unlike Actions artifacts above.
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically updated on every push to main. Download bhav-tau.apk below.
          files: bhav-tau.apk
